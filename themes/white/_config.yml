############## style ##############
style:
  layout:
    max-width: 1130px #总体宽度
    post-max-width: 800px #文章内容宽度
  color:
    theme-main: "#a61b29" # 主色调 880A11 RED 025E7D 深蓝
    theme-secondary: "#e3b4b8" # 次色调
    text-main: "#111111" # 文字主色调
    text-secondary: "#636363" # 文字次色调
  animation:
    open: true # 如果开启动画的话会引入animation.css


########## 关于主页的设置 ##########
# home页可选类型
home:
  type: "home" # 主页的类型，可选 home | img | simple

# archive页可选类型
archive:
  type: "simple" # archive的类型，可选 img | simple

categories:
  type: "img" # archive的类型，可选 img | simple

tags:
  type: "img" # archive的类型，可选 img | simple

archive_img_mode:
  default_cover: #默认的cover
    - https://pic1.zhimg.com/80/v2-ef1e4248f488b37a656c8a3aa52924f8_720w.jpeg
    - https://pic3.zhimg.com/80/v2-3a1a092de8959659a515fd552ec7c188_1440w.jpeg
    - https://picx.zhimg.com/80/v2-0897d477d9c6dd17d6bcd64499e2473c_1440w.jpeg
    - https://pica.zhimg.com/80/v2-9cbaf1d46c46dd1a1e8dc36701926cc1_1440w.jpeg
    - https://picx.zhimg.com/80/v2-86e967a5095d691cf3fc7b04f9646aae_1440w.png

# icon
icon:  https://cdn.jsdelivr.net/gh/Shannju/Picture/Ico/hanaku.ico
#标签页图标
#  header
site_name: Blog of Shan
site_description: Daydreamer. #The default meta description for all the meta descriptions
#Add description property to any page to change the meta description
menu:
  HOME: / 
  BLOG: /archives 
  ABOUT: /about


gallery:
  Photo: /photos
  

  


